name: Static Site CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Static site checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install CI dependencies
        run: npm ci

      - name: Validate HTML
        run: |
          source_dir=.
          if [ -f src/index.html ]; then source_dir=src; fi
          npx htmlhint "$source_dir/index.html" "$source_dir/upperbodyscan.html" "$source_dir/lowerbodyscan.html"

      - name: Check JavaScript syntax
        run: |
          source_dir=.
          if [ -f src/script.js ]; then source_dir=src; fi
          node --check "$source_dir/script.js"
          node --check "$source_dir/body-areas.js"
          node --check "$source_dir/muscle-catalog.js"
          node --check "$source_dir/viewer.js"
          node --check "$source_dir/body-area-config.mjs"
          node --check "$source_dir/body-area-controls.mjs"
          node --check "$source_dir/body-area-focus.mjs"

      - name: Verify body-map source ownership
        run: npm run test:body-map

      - name: Verify required site files
        run: |
          source_dir=.
          if [ -f src/index.html ]; then source_dir=src; fi
          test -s "$source_dir/index.html"
          test -s "$source_dir/upperbodyscan.html"
          test -s "$source_dir/lowerbodyscan.html"
          test -s "$source_dir/styles.css"
          test -s "$source_dir/script.js"
          test -s "$source_dir/body-areas.js"
          test -s "$source_dir/muscle-catalog.js"
          test -s "$source_dir/viewer.js"
          test -s "$source_dir/assets/human-body2.glb"
